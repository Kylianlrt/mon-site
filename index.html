<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BADSMASH - Accueil</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background-color: var(--card-bg); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .burger-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
        }

        .logo { font-size: 1.4rem; font-weight: 800; text-decoration: none; color: var(--text-main); }
        .logo span { color: var(--accent-green); }

        .btn-login {
            color: var(--accent-green); border: 1px solid var(--accent-green);
            padding: 6px 14px; border-radius: 20px; font-weight: 600; text-decoration: none; font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background-color: var(--accent-green);
            color: var(--bg-color);
        }

        /* Menu Latéral Burger (Drawer) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            z-index: 201;
            padding: 24px;
            border-right: 1px solid var(--border);
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .drawer.active {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .menu-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-item:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* Contenu Principal */
        main {
            max-width: 600px; margin: 0 auto; padding: 60px 20px; text-align: center;
        }

        .welcome-card {
            background-color: var(--card-bg);
            padding: 32px 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .welcome-message {
            font-size: 1.5rem; font-weight: 700; line-height: 1.5;
            margin-bottom: 28px;
        }
        .welcome-message span { color: var(--accent-green); }

        .btn-spectateur-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--accent-green);
            color: var(--bg-color);
            text-decoration: none;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-spectateur-main:hover {
            background-color: #0d9668;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="burger-btn" onclick="toggleMenu()">☰</button>
            <a href="index.html" class="logo">BAD<span>SMASH</span></a>
        </div>
        <a href="connexion.html" class="btn-login">Se connecter</a>
    </header>

    <!-- Menu Burger Coulissant -->
    <div class="drawer-overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <a href="index.html" class="logo">BAD<span>SMASH</span></a>
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-title">Navigation</div>
        <nav class="nav-links">
            <a href="spectateur.html" class="nav-item">
                <span>👀</span> Mode Spectateur
            </a>
            <a href="joueur.html" class="nav-item">
                <span>🏸</span> Espace Joueur
            </a>
            <a href="admin.html" class="nav-item">
                <span>⚙️</span> Admin
            </a>
        </nav>
    </div>

    <!-- Contenu Principal -->
    <main>
        <div class="welcome-card">
            <h1 class="welcome-message">
                Bienvenue sur le site web de <span>Kylian</span> pour voir les scores et les matchs en direct
            </h1>
            
            <a href="spectateur.html" class="btn-spectateur-main">
                👀 Suivre le match en direct
            </a>
        </div>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('drawer').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>

</body>
</html>
