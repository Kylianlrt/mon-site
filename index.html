<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kylian Laurent - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===================== LOADER ===================== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
            transition: opacity 0.6s ease;
        }

        #loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100000;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
            );
        }

        .loader-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 50%, rgba(0,212,255,0.04) 0%, transparent 70%);
        }

        .loader-box {
            width: min(700px, 95vw);
            border: 1px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0,212,255,0.3), inset 0 0 30px rgba(0,0,0,0.8);
            padding: 28px 32px;
            background: rgba(0, 4, 10, 0.97);
        }

        .loader-titlebar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0,212,255,0.2);
            padding-bottom: 14px;
        }

        .loader-dots { display: flex; gap: 6px; }
        .loader-dots span {
            width: 10px; height: 10px;
            border-radius: 50%;
        }

        .loader-title {
            color: #00d4ff;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            flex: 1;
            text-align: center;
        }

        .loader-log {
            height: 240px;
            overflow-y: auto;
            margin-bottom: 22px;
            scrollbar-width: none;
        }
        .loader-log::-webkit-scrollbar { display: none; }

        .loader-log-line {
            font-size: 12px;
            line-height: 1.8;
            letter-spacing: 0.04em;
        }

        .loader-log-line .line-idx {
            color: rgba(0,212,255,0.35);
            margin-right: 8px;
        }

        .log-ok      { color: #00d4ff; }
        .log-detect  { color: #00cfff; }
        .log-warn    { color: #ffee00; }
        .log-active  { color: #00ffaa; }
        .log-default { color: #77bbcc; }
        .log-dim     { opacity: 0.7; }

        .loader-cursor {
            display: inline-block;
            color: #00d4ff;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        .loader-bar-label {
            display: flex;
            justify-content: space-between;
            color: #00d4ff;
            font-size: 11px;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .loader-bar-track {
            height: 18px;
            background: rgba(0,40,60,0.8);
            border: 1px solid rgba(0,212,255,0.4);
            position: relative;
            overflow: hidden;
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #004466, #00d4ff);
            box-shadow: 0 0 12px #00d4ff;
            transition: width 0.04s linear;
            position: relative;
        }

        .loader-bar-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 20px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
        }

        .loader-bar-ticks {
            position: absolute;
            inset: 0;
            display: flex;
        }
        .loader-bar-ticks span {
            flex: 1;
            border-right: 1px solid rgba(0,0,0,0.4);
        }

        .loader-status {
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 14px;
            color: #ffee00;
            transition: all 0.5s;
        }

        .loader-status.done {
            color: #00d4ff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 12px #00d4ff;
        }

        /* ===================== SITE (caché au départ) ===================== */
        #site { display: none; }

        /* ===================== STYLES DU SITE ===================== */
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --text-primary: #ffffff;
            --text-secondary: #00d4ff;
            --accent-1: #00d4ff;
            --accent-2: #00ff88;
            --grid-color: rgba(0, 212, 255, 0.03);
            --card-bg: rgba(0, 212, 255, 0.05);
            --border-color: rgba(0, 212, 255, 0.2);
            --shadow-color: rgba(0, 212, 255, 0.1);
        }

        body.light-mode {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --text-primary: #1a202c;
            --text-secondary: #2563eb;
            --accent-1: #3b82f6;
            --accent-2: #10b981;
            --grid-color: rgba(59, 130, 246, 0.08);
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(59, 130, 246, 0.3);
            --shadow-color: rgba(59, 130, 246, 0.15);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            transition: all 0.5s ease;
        }

        .animated-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
            transition: all 0.5s ease;
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            width: 200%; height: 200%;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, var(--grid-color) 2px, var(--grid-color) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, var(--grid-color) 2px, var(--grid-color) 4px);
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .particle {
            position: fixed;
            width: 3px; height: 3px;
            background: var(--accent-1);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-1);
            animation: float 10s linear infinite;
            z-index: 0;
            transition: background 0.5s ease;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--border-color);
            z-index: 1000;
            box-shadow: 0 5px 30px var(--shadow-color);
            transition: all 0.5s ease;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .header-controls { display: flex; gap: 15px; align-items: center; }

        .theme-toggle {
            width: 50px; height: 50px;
            cursor: pointer;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .theme-toggle:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--accent-1); }
        .theme-toggle svg { width: 24px; height: 24px; fill: var(--accent-1); transition: all 0.3s ease; }
        .theme-toggle .moon { display: block; }
        .theme-toggle .sun { display: none; }
        body.light-mode .theme-toggle .moon { display: none; }
        body.light-mode .theme-toggle .sun { display: block; }

        .burger {
            width: 40px; height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1001;
        }

        .burger:hover { box-shadow: 0 0 20px var(--accent-1); }
        .burger span { width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); border-radius: 10px; transition: all 0.3s ease; }
        .burger.active span:nth-child(1) { transform: rotate(45deg) translate(7px, 7px); }
        .burger.active span:nth-child(2) { opacity: 0; }
        .burger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }

        nav {
            position: fixed;
            top: 0; right: -350px;
            width: 350px; height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 120px 40px 40px;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 999;
            box-shadow: -10px 0 30px var(--shadow-color);
            border-left: 2px solid var(--border-color);
        }

        nav.nav-open { right: 0; }

        nav a {
            display: block;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 18px 20px;
            margin-bottom: 8px;
            border-left: 3px solid transparent;
            background: var(--card-bg);
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
            transition: left 0.5s ease;
        }

        nav a:hover::before { left: 100%; }
        nav a:hover { background: var(--border-color); border-left-color: var(--accent-1); padding-left: 30px; box-shadow: 0 5px 15px var(--shadow-color); color: var(--accent-1); }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 40px;
            position: relative;
            z-index: 1;
        }

        .name-container { position: relative; padding: 40px; }

        .name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-1));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            position: relative;
        }

        .name::before {
            content: 'KYLIAN LAURENT';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(20px);
            opacity: 0.5;
            z-index: -1;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .profession {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-1);
            padding: 20px 40px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: all 0.5s ease;
        }

        .profession::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, var(--border-color), transparent);
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .subtitle { display: block; font-size: clamp(0.8rem, 1.5vw, 1rem); margin-top: 10px; color: var(--accent-2); font-weight: 300; }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            header h1 { font-size: 1.3rem; }
            .theme-toggle { width: 40px; height: 40px; }
            nav { width: 100%; right: -100%; padding: 100px 30px 30px; }
            .name { letter-spacing: 4px; }
            .profession { letter-spacing: 2px; padding: 15px 25px; }
        }
    </style>
</head>
<body>

    <script>
    // ===================== LOADER LOGIC =====================
    const bootMessages = [
        { text: "Initialisation du système KylianLaurent v2.7.4...", type: "default" },
        { text: "Chargement du noyau principal... [OK]", type: "ok" },
        { text: "Lancement du protocole d'embarquement... [OK]", type: "ok" },
        { text: "Vérification de l'intégrité des données personnelles...", type: "warn" },
        { text: "Intégrité vérifiée — aucune corruption détectée. [OK]", type: "ok" },
        { text: "Calibration des capteurs de charme... [OK]", type: "ok" },
        { text: "Chargement du module SWAG_ENGINE.dll... [OK]", type: "ok" },
        { text: "Détection du matériel: Cerveau Ultra-Pro MAX... [DÉTECTÉ]", type: "detect" },
        { text: "Synchronisation de l'horloge interne... [OK]", type: "ok" },
        { text: "Initialisation du protocole de séduction... [EN COURS]", type: "warn" },
        { text: "Chargement des talents cachés v3.1... [OK]", type: "ok" },
        { text: "Activation du module anti-haters.exe... [OK]", type: "ok" },
        { text: "Démarrage du service AMBITION_CORE... [OK]", type: "ok" },
        { text: "Connexion au réseau neuronal KL... [ÉTABLIE]", type: "detect" },
        { text: "Chargement de la bibliothèque de moves.lib... [OK]", type: "ok" },
        { text: "Vérification des permissions administrateur... [ACCORDÉES]", type: "detect" },
        { text: "Activation du turbo-boost mode... [EN LIGNE]", type: "active" },
        { text: "Montage du système de fichiers /home/kylianlaurent... [OK]", type: "ok" },
        { text: "Démarrage du service CONFIANCE_EN_SOI... [ACTIF]", type: "active" },
        { text: "Lancement du daemon background_glow.service... [OK]", type: "ok" },
        { text: "Chargement du protocole BONNE_HUMEUR_v9... [OK]", type: "ok" },
        { text: "Analyse des objectifs journaliers... [CHARGEMENT]", type: "warn" },
        { text: "Optimisation des performances cognitives... [OK]", type: "ok" },
        { text: "Activation du mode LÉGENDAIRE... [STANDBY]", type: "warn" },
        { text: "Compilation des souvenirs épiques... [OK]", type: "ok" },
        { text: "Initialisation du moteur de motivation... [OK]", type: "ok" },
        { text: "Démarrage du processus GRIND_FOREVER.exe... [OK]", type: "ok" },
        { text: "Chargement de la personnalité principale... [100%]", type: "active" },
        { text: "Système prêt. Bienvenue, KylianLaurent.", type: "ok" },
    ];

    const logEl      = document.getElementById('loaderLog');
    const fillEl     = document.getElementById('loaderFill');
    const percentEl  = document.getElementById('loaderPercent');
    const statusEl   = document.getElementById('loaderStatus');
    const loaderEl   = document.getElementById('loader');
    const siteEl     = document.getElementById('site');

    const colorMap = {
        ok:      'log-ok',
        detect:  'log-detect',
        warn:    'log-warn',
        active:  'log-active',
        default: 'log-default',
    };

    const DURATION = 7000;
    const msgInterval = DURATION / bootMessages.length;
    let msgIndex = 0;
    let progress = 0;
    let startTime = null;

    function addMessage(msg, index) {
        // Remove cursor first
        const cursor = logEl.querySelector('.loader-cursor');
        if (cursor) cursor.remove();

        const line = document.createElement('div');
        line.className = 'loader-log-line ' + colorMap[msg.type];

        const idx = document.createElement('span');
        idx.className = 'line-idx';
        idx.textContent = '[' + String(index).padStart(2, '0') + ']';

        line.appendChild(idx);
        line.appendChild(document.createTextNode(msg.text));
        logEl.appendChild(line);

        // Re-add cursor
        const cur = document.createElement('span');
        cur.className = 'loader-cursor';
        cur.textContent = '█';
        logEl.appendChild(cur);

        logEl.scrollTop = logEl.scrollHeight;
    }

    function animateProgress(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const raw = Math.min(elapsed / DURATION, 1);
        // Easing
        const eased = raw < 0.5 ? 2 * raw * raw : -1 + (4 - 2 * raw) * raw;
        progress = Math.floor(eased * 100);

        fillEl.style.width = progress + '%';
        percentEl.textContent = progress + '%';

        if (raw < 1) {
            requestAnimationFrame(animateProgress);
        }
    }

    // Lancer les messages
    function scheduleMessages() {
        bootMessages.forEach((msg, i) => {
            setTimeout(() => {
                addMessage(msg, i);
                if (i === bootMessages.length - 1) {
                    // Tout est chargé
                    setTimeout(() => {
                        fillEl.style.width = '100%';
                        percentEl.textContent = '100%';
                        statusEl.textContent = '✓ KYLIANLAURENT CHARGÉ AVEC SUCCÈS';
                        statusEl.classList.add('done');

                        // Transition vers le site après 1 seconde
                        setTimeout(() => {
                            loaderEl.classList.add('fade-out');
                            document.querySelector('.loader-scanlines').style.opacity = '0';
                            document.querySelector('.loader-glow').style.opacity = '0';
                            setTimeout(() => {
                                loaderEl.style.display = 'none';
                                document.querySelector('.loader-scanlines').style.display = 'none';
                                document.querySelector('.loader-glow').style.display = 'none';
                                siteEl.style.display = 'block';
                            }, 600);
                        }, 1000);
                    }, 200);
                }
            }, i * msgInterval);
        });
    }

    if (!localStorage.getItem('loaderSeen')) {
        localStorage.setItem('loaderSeen', 'true');
        requestAnimationFrame(animateProgress);
        scheduleMessages();
    } else {
        loaderEl.style.display = 'none';
        document.querySelector('.loader-scanlines').style.display = 'none';
        document.querySelector('.loader-glow').style.display = 'none';
        siteEl.style.display = 'block';
    }

    // ===================== SITE LOGIC =====================
    // Particules
    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        document.getElementById('site').appendChild(particle);
    }

    // Menu burger
    const burger = document.getElementById('burger');
    const nav    = document.getElementById('nav');

    burger.addEventListener('click', () => {
        burger.classList.toggle('active');
        nav.classList.toggle('nav-open');
    });

    document.querySelectorAll('nav a').forEach(link => {
        link.addEventListener('click', () => {
            burger.classList.remove('active');
            nav.classList.remove('nav-open');
        });
    });

    document.addEventListener('click', (e) => {
        if (!burger.contains(e.target) && !nav.contains(e.target)) {
            burger.classList.remove('active');
            nav.classList.remove('nav-open');
        }
    });

    // Mode clair/sombre
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    if (localStorage.getItem('theme') === 'light') body.classList.add('light-mode');

    themeToggle.addEventListener('click', () => {
        body.classList.toggle('light-mode');
        localStorage.setItem('theme', body.classList.contains('light-mode') ? 'light' : 'dark');
    });
    </script>
</body>
</html>
