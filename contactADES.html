<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mon Alternance</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 212, 255, 0.03) 2px, rgba(0, 212, 255, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 255, 136, 0.03) 2px, rgba(0, 255, 136, 0.03) 4px);
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(0, 212, 255, 0.2);
            z-index: 1000;
            box-shadow: 0 5px 30px rgba(0, 212, 255, 0.1);
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        /* Burger Menu */
        .burger {
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1001;
        }

        .burger:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .burger span {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .burger.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }

        .burger.active span:nth-child(2) {
            opacity: 0;
        }

        .burger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: linear-gradient(135deg, rgba(0, 10, 30, 0.98), rgba(0, 30, 60, 0.98));
            backdrop-filter: blur(20px);
            padding: 120px 40px 40px;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 999;
            box-shadow: -10px 0 30px rgba(0, 212, 255, 0.2);
            border-left: 2px solid rgba(0, 212, 255, 0.3);
        }

        nav.nav-open {
            right: 0;
        }

        nav a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 18px 20px;
            margin-bottom: 8px;
            border-left: 3px solid transparent;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        nav a:hover::before {
            left: 100%;
        }

        nav a:hover {
            background: rgba(0, 212, 255, 0.15);
            border-left-color: #00d4ff;
            padding-left: 30px;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
            color: #00d4ff;
        }

        /* Bouton Retour */
        .btn-back {
            position: fixed;
            top: 100px;
            left: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 255, 136, 0.15));
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 50px;
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }

        .btn-back:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 255, 136, 0.25));
            transform: translateX(-5px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
        }

        .btn-back .arrow {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .btn-back:hover .arrow {
            transform: translateX(-3px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            margin-top: 80px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 60px 40px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.05), rgba(0, 255, 136, 0.05));
            border-radius: 20px;
            border: 2px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 50px rgba(0, 212, 255, 0.1);
            position: relative;
            overflow: hidden;
            margin-bottom: 50px;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 212, 255, 0.05), transparent);
            animation: rotate-gradient 6s linear infinite;
        }

        @keyframes rotate-gradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            letter-spacing: 3px;
        }

        .header p {
            font-size: 1.3rem;
            color: #00ff88;
            position: relative;
            z-index: 1;
            font-weight: 500;
        }

        /* Info Sections */
        .info-section {
            background: rgba(0, 212, 255, 0.03);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .info-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            animation: slide-line 3s linear infinite;
        }

        @keyframes slide-line {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .info-section h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #00d4ff;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-section p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.9);
        }

        .info-box {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 136, 0.1));
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            margin-top: 20px;
        }

        .info-box p {
            margin-bottom: 12px;
        }

        .info-box strong {
            color: #00ff88;
            font-weight: 600;
            font-size: 1.1em;
        }

        .info-box a {
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .info-box a:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .editable {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(255, 152, 0, 0.2));
            padding: 3px 8px;
            border-radius: 5px;
            border-bottom: 2px solid rgba(255, 193, 7, 0.5);
            color: #ffd54f;
            font-weight: 500;
        }

        /* Contact Grid */
        .contact-grid {
            display: grid;
            gap: 30px;
        }

        .contact-info h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #00d4ff;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-item {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 136, 0.1));
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            margin-bottom: 15px;
        }

        .info-label {
            color: #00ff88;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .info-value {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.05rem;
        }

        .info-value a {
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .info-value a:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            header h1 {
                font-size: 1.3rem;
            }

            nav {
                width: 100%;
                right: -100%;
                padding: 100px 30px 30px;
            }

            .btn-back {
                top: 80px;
                left: 20px;
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .container {
                padding: 20px 15px;
                margin-top: 60px;
            }

            .header {
                padding: 40px 20px;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .info-section {
                padding: 25px 20px;
            }

            .info-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <!-- Header avec menu burger -->
    <header>
        <h1>PORTFOLIO</h1>
        <div class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- Navigation -->
    <nav id="nav">
        <a href="index.html">Accueil</a>
        <a href="about-me.html">À propos</a>
        <a href="enterprise.html">Entreprise</a>
        <a href="projects.html">Projets</a>
        <a href="database.html">Base de connaissances</a>
        <a href="formations.html">Formations</a>
        <a href="logiciels.html">Logiciels</a>
        <a href="reviews.html">Avis</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Bouton Retour -->
    <a href="javascript:history.back()" class="btn-back">
        <span class="arrow">←</span> Retour
    </a>

    <div class="container">
        <div class="header">
            <h1>Contact</h1>
        </div>

        <!-- Informations Entreprise -->
        <div class="info-section">
            <div class="info-box">
                <p><strong>📞 Téléphone :</strong> <span class="editable">05.31.616.316</span></p>
                <p><strong>📧 Email :</strong> <a href="https://www.ades.fr/"><span class="editable">contact@ades-mp.fr</span></a></p>
                <p><strong>🌐 Site Web :</strong> <a href="https://www.ades.fr/" target="_blank"><span class="editable">https://www.ades.fr//</span></a></p>
            </div>
        </div>
    </div>

    <script>
        // Menu burger
        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav');

        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            nav.classList.toggle('nav-open');
        });

        // Fermer le menu en cliquant sur un lien
        const navLinks = document.querySelectorAll('nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                nav.classList.remove('nav-open');
            });
        });

        // Fermer le menu en cliquant en dehors
        document.addEventListener('click', (e) => {
            if (!burger.contains(e.target) && !nav.contains(e.target)) {
                burger.classList.remove('active');
                nav.classList.remove('nav-open');
            }
        });
    </script>
</body>
</html>
